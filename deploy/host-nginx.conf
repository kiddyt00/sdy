# 独立小程序商城 · 主机级 Nginx 模板（生产服务器 /etc/nginx/conf.d/<域名>.conf）
#
# 生产实际在跑的就是本文件（域名 mall.shadouyou.cloud，2026-10-13 第 22 轮上线）。
# 与同机 yiguan 的 zgjz.insightj.cn.conf / gjz.shadouyou.cloud.conf 并存互不影响：
#   - 本文件只监听自己的 server_name，绝不会抢 yiguan 的流量
#   - 端口只用 8093 / 8094（yiguan 用 8080/8081/8082，互不冲突）
#   - upstream 取名 sdy_api_domain：**不能**与 deploy/host-nginx-ip.conf 里的 sdy_api 重名。
#     nginx 的 upstream 名是 http 级全局唯一，重名会让 `nginx -t` 直接报
#     `[emerg] duplicate upstream "sdy_api"`，而且**两个文件同时存在**时才会暴露
#     （IP 入口还没关掉 + 域名入口刚加上的阶段最容易踩）。
#
# 上线步骤（第 22 轮实测通过）：
#   1) 域名 A 记录指向本机公网 IP，等生效：dig +short <域名> A
#   2) 先只装下面的 :80 段（去掉 443 段），`nginx -t && systemctl reload nginx`
#      —— 证书还没签发时若带上 443 段，nginx -t 会因为 ssl_certificate 不存在而失败
#   3) acme.sh 用 webroot 签发（本机已有 acme.sh v3.1.3 + 每日 --cron 自动续期，
#      webroot 与同机其它站点共用 /usr/share/nginx/html/beian）：
#        ~/.acme.sh/acme.sh --issue -d <域名> --webroot /usr/share/nginx/html/beian --keylength ec-256
#   4) 装证书到本机统一目录，并登记续期后自动 reload：
#        ~/.acme.sh/acme.sh --install-cert -d <域名> --ecc \
#          --fullchain-file /etc/nginx/conf.d/certs/<域名>.fullchain.pem \
#          --key-file       /etc/nginx/conf.d/certs/<域名>.key \
#          --reloadcmd      "systemctl reload nginx"
#      （.key 记得 chmod 600；同机其它站点也都在这个目录里放证书）
#   5) 补上 443 段 → `nginx -t && systemctl reload nginx`
#   6) 验证：curl -sS https://<域名>/healthz ；再确认同机其它域名逐个没受影响
#   7) 小程序后台 → 开发管理 → 服务器域名 → request 合法域名 填 https://<域名>

upstream sdy_api_domain {
    server 127.0.0.1:8093;
    server 127.0.0.1:8094;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __SDY_DOMAIN__;

    # ACME http-01 challenge（acme.sh 签发与续期用），与同机其它站点同款 webroot
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html/beian;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __SDY_DOMAIN__;

    ssl_certificate     /etc/nginx/conf.d/certs/__SDY_DOMAIN__.fullchain.pem;
    ssl_certificate_key /etc/nginx/conf.d/certs/__SDY_DOMAIN__.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 8m;
    access_log /var/log/nginx/sdy.access.log;
    error_log  /var/log/nginx/sdy.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html/beian;
    }

    # 后端 API（Go 服务，蓝绿池）
    location /api/ {
        proxy_pass http://sdy_api_domain;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location = /healthz {
        proxy_pass http://sdy_api_domain;
        proxy_set_header Host $host;
        access_log off;
    }

    # 静态前端（容器内挂载 ./web；小程序端上线后可只留演示页）
    location / {
        proxy_pass http://sdy_api_domain;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
