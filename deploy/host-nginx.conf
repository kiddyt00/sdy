# 独立小程序商城 · 主机级 Nginx 模板（生产服务器 /etc/nginx/conf.d/<域名>.conf）
#
# 与同机 yiguan 的 zgjz.insightj.cn.conf 并存互不影响：
#   - 本文件只监听你自己的 server_name，绝不会抢 yiguan 的流量
#   - 端口只用 8093 / 8094（yiguan 用 8081/8082，互不冲突）
#
# 上线步骤：
#   1) 将 __SDY_DOMAIN__ 替换为真实域名（需已备案）
#   2) 证书用 acme.sh 签发：~/.acme.sh/acme.sh --issue -d <域名> --nginx
#      （证书路径按 acme.sh 默认输出，见下方 ssl_certificate）
#   3) cp deploy/host-nginx.conf /etc/nginx/conf.d/<域名>.conf
#   4) nginx -t && systemctl reload nginx

upstream sdy_api {
    server 127.0.0.1:8093;
    server 127.0.0.1:8094;
    keepalive 32;
}

server {
    listen 80;
    server_name __SDY_DOMAIN__;
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name __SDY_DOMAIN__;

    ssl_certificate     /root/acme.sh-repo/__SDY_DOMAIN___ecc/fullchain.cer;
    ssl_certificate_key /root/acme.sh-repo/__SDY_DOMAIN___ecc/__SDY_DOMAIN__.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 8m;
    access_log /var/log/nginx/sdy.access.log;
    error_log  /var/log/nginx/sdy.error.log;

    # 后端 API（Go 服务，蓝绿池）
    location /api/ {
        proxy_pass http://sdy_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location = /healthz {
        proxy_pass http://sdy_api;
        proxy_set_header Host $host;
        access_log off;
    }

    # 静态前端（容器内挂载 ./web；小程序端上线后可只留演示页）
    location / {
        proxy_pass http://sdy_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
