# 独立小程序商城 · 主机级 Nginx「IP 直连」入口（域名备案前的看界面通道）
#
# 与 deploy/host-nginx.conf 的区别：那个走域名 + TLS，这个只认主机 IP、走 HTTP，
# 用于「域名还没准备好，但想立刻在手机上打开看界面」的阶段。
#
# 为什么不会影响同机其它站点：server_name 只写本机 IP，nginx 按 Host 精确匹配；
# 未知 Host 仍然落到 beian 的 default_server，yiguan / beian 的域名流量一点不受影响。
#
# 上线步骤（在生产服务器上执行）：
#   1) sed 's/__SDY_HOST__/<本机公网IP>/' deploy/host-nginx-ip.conf > /etc/nginx/conf.d/sdy-ip.conf
#   2) nginx -t && systemctl reload nginx
#   3) 验证：curl -s -H 'Host: <本机公网IP>' http://127.0.0.1/healthz
#   4) 关闭该入口：rm /etc/nginx/conf.d/sdy-ip.conf && nginx -t && systemctl reload nginx

upstream sdy_api {
    server 127.0.0.1:8093;
    server 127.0.0.1:8094;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __SDY_HOST__;

    client_max_body_size 8m;
    access_log /var/log/nginx/sdy.access.log;
    error_log  /var/log/nginx/sdy.error.log;

    # 后端 API（Go 服务，蓝绿池）
    location /api/ {
        proxy_pass http://sdy_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location = /healthz {
        proxy_pass http://sdy_api;
        proxy_set_header Host $host;
        access_log off;
    }

    # 前端页面（容器内挂载 ./web，Go 直接托管静态文件）
    location / {
        proxy_pass http://sdy_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
