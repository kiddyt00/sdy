<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>啥都有快送 · 在线商城</title>
<meta name="theme-color" content="#16a34a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🛒</text></svg>">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* 顾客端局部微调 */
  .topnav { display: flex; gap: 4px; }
  .topnav .tn {
    padding: 7px 14px; border-radius: var(--r-pill); font-size: 13px; color: var(--muted);
    cursor: pointer; border: 1px solid transparent; user-select: none;
  }
  .topnav .tn.on { background: #fff; color: var(--ink); border-color: var(--line); font-weight: 500; box-shadow: var(--sh-1); }
  .detail-head { display: flex; gap: 16px; }
  .detail-head .dph { width: 96px; height: 96px; border-radius: var(--r); background: linear-gradient(140deg,#f8fafc,#eef2f7); display: grid; place-items: center; font-size: 44px; flex: 0 0 96px; overflow: hidden; }
  .detail-head .dph .dimg { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* 收货地址簿（D18） */
  .addr-list { display: flex; flex-direction: column; gap: 8px; }
  .addr-item {
    border: 1px solid var(--line); border-radius: var(--r-sm); padding: 9px 12px;
    background: #fff; font-size: 13px; line-height: 1.5; cursor: pointer;
  }
  .addr-item:hover { border-color: #cbd5e1; }
  .addr-item.on { border-color: var(--brand); background: var(--brand-light); }
  .addr-item .who { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .addr-item .ad { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .addr-item .ops { display: flex; gap: 6px; margin-top: 8px; }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
  .chk input { width: 15px; height: 15px; accent-color: var(--brand); }
  .fld-head { display: flex; align-items: center; justify-content: space-between; }
  /* 批发价（任务池⑦ / D24）：批发/白名单等级顾客看到批发价，原零售价划掉 */
  .price.whole { color: #c2410c; }
  .oldp { color: var(--faint); text-decoration: line-through; font-size: 12px; margin-left: 6px; font-weight: 400; }
  .wtag {
    background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa;
    border-radius: var(--r-pill); padding: 0 6px; font-size: 11px; white-space: nowrap;
  }
  /* 连接状态只留一个小圆点（第 25 轮 / D31）：顾客端不露「后端已连接」这种开发信息 */
  .dot-mode {
    width: 9px; height: 9px; border-radius: 50%; display: inline-block;
    background: #d1d5db; flex: none; cursor: default;
  }
  .dot-mode.on { background: var(--green); box-shadow: 0 0 0 4px var(--green-bg); }
  .dot-mode.off { background: #d1d5db; }

  /* 第 27 轮（P0-1）：离线降级提示条。黄色底 + 深黄字，和「下单成功」的绿色一眼区分。 */
  .offline-wrap {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--amber-bg); border: 1px solid var(--amber-line);
    border-radius: var(--r-sm); padding: 9px 12px; margin: 0 0 10px;
  }
  .offline-bar { color: var(--amber); font-size: 12.5px; line-height: 1.5; }
  .offline-wrap .offline-bar { flex: 1; min-width: 150px; }
  .offline-retry {
    flex: none; font-family: inherit; font-size: 12.5px; color: var(--amber); cursor: pointer;
    background: #fff; border: 1px solid var(--amber-line); border-radius: 7px; padding: 6px 12px;
  }
  /* 结算弹窗里的同款提示：弹窗盖住了顶部提示条，必须就地再说一次 */
  #coOffline {
    background: var(--amber-bg); border: 1px solid var(--amber-line);
    border-radius: var(--r-sm); padding: 9px 12px; margin-bottom: 12px;
  }
  /* 第 27 轮（P1-9）：这两个是「一组控件」的标题，没有单一 for 目标，不能写成空 label */
  .fld-label { font-size: 12px; font-weight: 500; color: var(--muted); }
  /* 第 27 轮（P1-9）：div 改成真按钮后抹掉浏览器默认样式，视觉保持原样 */
  .topnav .tn { font-family: inherit; background: transparent; }
  .dopt { font-family: inherit; text-align: left; width: 100%; }
</style>
</head>
<body>
<div class="mask" id="mask" onclick="closeAll()" role="presentation" aria-hidden="true"></div>

<!-- ============ 顶部 ============ -->
<header class="shop-head">
  <div class="shop" style="padding-bottom:0">
    <!-- 第 27 轮（P0-1）：离线降级常驻警示条。探测失败会静默降级成「本地演示」，
         顾客却照样看到绿色下单成功——这条黄条 + 禁用提交按钮就是让降级看得见。 -->
    <div class="offline-wrap hide" id="offlineWrap">
      <span class="offline-bar" id="offlineBar" role="status" aria-live="polite"></span>
      <button class="offline-retry" type="button" onclick="retryConnect()">🔄 重试连接</button>
    </div>
    <div class="row-between">
      <div class="brand">
        <div class="logo">🛒</div>
        <div>
          <div class="name">啥都有快送</div>
          <div class="sub">满 30 元免配送费 · 每日 07:30–22:30</div>
        </div>
      </div>
      <div class="row">
        <span class="dot-mode" id="modeBadge" title="后端状态"></span>
        <div class="topnav">
          <button type="button" class="tn on" id="tabHome" onclick="switchView('home')">逛商品</button>
          <button type="button" class="tn" id="tabOrders" onclick="switchView('orders')">我的订单</button>
        </div>
        <button class="cart-btn" onclick="openCart()">🛒 购物车<span class="cart-dot" id="cartDot">0</span></button>
      </div>
    </div>
    <div class="shop-tools">
      <div class="search grow">
        <span>🔎</span>
        <input id="q" placeholder="搜商品名 / 品牌 / 条码" oninput="doSearch()">
      </div>
      <button class="btn" onclick="openScan()">📷 扫码找货</button>
      <button class="btn" id="btnMyPrice" onclick="openMyPrice()" title="输入手机号，按你的顾客等级显示价格">💰 我的价格</button>
      <button class="btn" onclick="openAddrBook()">📍 地址簿</button>
    </div>
  </div>
</header>

<main class="shop">
  <!-- ============ 首页 ============ -->
  <section id="viewHome">
    <div class="hero">
      <div>
        <h2>邻里小店 · 送到家门口</h2>
        <p>整箱饮料、日用百货都能下单；满 30 元免配送费，也可以到店自提。</p>
      </div>
      <div class="tag">🕘 下单后 30 分钟内处理</div>
    </div>

    <div class="cat-bar"><div class="chips" id="cats"></div></div>
    <div class="products" id="grid"></div>
  </section>

  <!-- ============ 我的订单 ============ -->
  <section id="viewOrders" class="hide">
    <div class="panel">
      <div class="panel-head">
        <h3>我的订单<span class="sub" id="orderCount"></span></h3>
        <button class="btn btn-xs" onclick="refreshOrders()">↻ 刷新</button>
      </div>
      <div class="panel-body">
        <div class="chips" id="filters" style="margin-bottom:14px"></div>
        <div id="orders"></div>
      </div>
    </div>
  </section>
</main>

<!-- ============ 底部结算条 ============ -->
<div class="cartbar hide" id="cartBar">
  <div><span class="n" id="barCount">0</span><span id="barText">购物车是空的</span></div>
  <button class="go" onclick="openCart()">查看购物车</button>
</div>

<!-- ============ 购物车抽屉 ============ -->
<aside class="drawer" id="cartSheet">
  <div class="drawer-head">
    <h3 style="font-size:15px">购物车 <span class="muted" id="cartHeadCount"></span></h3>
    <button class="icon-btn" onclick="closeAll()">✕</button>
  </div>
  <div class="drawer-body">
    <div id="cartLines"></div>
    <div class="row mt" style="justify-content:flex-end">
      <button class="btn btn-ghost btn-xs" onclick="clearCartNow()">清空购物车</button>
    </div>
  </div>
  <div class="drawer-foot">
    <div class="sum-line"><span>商品小计</span><span id="cartSubtotal">¥0.00</span></div>
    <div class="sum-line"><span>配送费（满 30 免）</span><span id="cartFee">—</span></div>
    <div class="sum-line total"><span>合计</span><b id="cartTotal">¥0.00</b></div>
    <button class="btn btn-primary btn-block mt" onclick="goCheckout()">去结算</button>
  </div>
</aside>

<!-- ============ 结算弹窗 ============ -->
<div class="modal" id="dlgCheckout">
  <div class="modal-head"><h3 style="font-size:16px">确认下单</h3><button class="icon-btn" onclick="closeAll()">✕</button></div>
  <div class="modal-body">
    <!-- 第 27 轮（P0-1）：结算弹窗盖住顶部提示条，这里再提醒一次，顾客才知道提交按钮为什么点不动 -->
    <div class="offline-bar hide" id="coOffline" role="status" aria-live="polite"></div>
    <div class="field">
      <div class="fld-label" id="delivLabel">配送方式</div>
      <div class="deliv-opts" role="group" aria-labelledby="delivLabel">
        <button type="button" class="dopt on" id="optPickup" onclick="pickDelivery('pickup')"><b>到店自提</b><span>免配送费 · 到店报手机号</span></button>
        <button type="button" class="dopt" id="optDelivery" onclick="pickDelivery('delivery')"><b>送货上门</b><span>满 30 元免，否则 3 元</span></button>
      </div>
    </div>
    <div class="field mt-lg hide" id="addrPickWrap">
      <div class="fld-head">
        <div class="fld-label">常用地址（点一下带出）</div>
        <button class="btn btn-xs" type="button" onclick="openAddrBook()">地址簿管理</button>
      </div>
      <div class="addr-list" id="addrPick"></div>
    </div>
    <div class="row mt-lg" style="gap:12px">
      <div class="field grow"><label for="cName">收货人</label><input class="input" id="cName" placeholder="怎么称呼" maxlength="20"></div>
      <div class="field grow"><label for="cPhone">手机号</label><input class="input" id="cPhone" placeholder="11 位手机号" maxlength="11" onchange="onPhoneChange()"></div>
    </div>
    <div class="field mt hide" id="addrField">
      <label for="cAddr">送货地址</label>
      <input class="input" id="cAddr" placeholder="小区 / 楼栋 / 门牌" maxlength="120">
      <label class="chk mt" id="addrSaveWrap"><input type="checkbox" id="addrSave" checked> 保存到地址簿，下次一键带出</label>
    </div>
    <div class="card mt-lg" style="padding:14px 16px">
      <div class="sum-line"><span>商品小计（<span id="coCount">0</span> 件）</span><span id="coSubtotal">¥0.00</span></div>
      <div class="sum-line"><span>配送费</span><span id="coFee">¥0.00</span></div>
      <div class="sum-line total"><span>应付</span><b id="coTotal">¥0.00</b></div>
      <div class="muted" style="font-size:12px;margin-top:6px" id="feeHint"></div>
    </div>
  </div>
  <div class="modal-foot">
    <button class="btn" onclick="closeAll()">再逛逛</button>
    <button class="btn btn-primary" id="btnSubmit" type="button" onclick="submitOrder()">提交订单</button>
  </div>
</div>

<!-- ============ 收货地址簿（D18） ============ -->
<div class="modal" id="dlgAddr" style="width:540px">
  <div class="modal-head"><h3 style="font-size:16px">收货地址簿</h3><button class="icon-btn" onclick="closeAll()">✕</button></div>
  <div class="modal-body">
    <div class="muted" style="font-size:12px;margin-bottom:8px">按手机号保存常用地址；默认地址下单时自动带出。</div>
    <div class="addr-list" id="addrBookList"></div>
    <div class="card mt-lg" style="padding:14px 16px">
      <div style="font-weight:600;font-size:13.5px;margin-bottom:10px" id="afTitle">新增地址</div>
      <div class="row" style="gap:12px">
        <div class="field grow"><label for="afContact">收货人</label><input class="input" id="afContact" placeholder="怎么称呼" maxlength="20"></div>
        <div class="field grow"><label for="afPhone">手机号</label><input class="input" id="afPhone" placeholder="11 位手机号" maxlength="11"></div>
      </div>
      <div class="field mt"><label for="afAddr">送货地址</label><input class="input" id="afAddr" placeholder="小区 / 楼栋 / 门牌" maxlength="120"></div>
      <label class="chk mt"><input type="checkbox" id="afDefault"> 设为默认地址</label>
      <div class="row mt" style="justify-content:flex-end;gap:8px">
        <button class="btn" type="button" onclick="resetAddrForm()">清空</button>
        <button class="btn btn-primary" type="button" onclick="saveAddrForm()">保存地址</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ 商品详情 ============ -->
<div class="modal" id="dlgDetail">
  <div class="modal-head"><h3 style="font-size:16px">商品详情</h3><button class="icon-btn" onclick="closeAll()">✕</button></div>
  <div class="modal-body">
    <div class="detail-head">
      <div class="dph" id="dEmoji">📦</div>
      <div class="grow">
        <h3 id="dName" style="font-size:17px"></h3>
        <div class="muted" style="font-size:12.5px;margin:4px 0 8px">
          条码 <span class="mono" id="dCode"></span> · <span id="dBrand"></span> · <span id="dSpec"></span>
        </div>
        <div class="price" id="dPrice"></div>
        <div class="stk" id="dStock"></div>
      </div>
    </div>
    <div class="row mt-lg" style="justify-content:space-between">
      <div class="stepper">
        <button onclick="stepQty(-1)">−</button><span class="v" id="dQty">1</span><button onclick="stepQty(1)">＋</button>
      </div>
      <button class="btn" id="dBuy" onclick="buyNowFromDetail()">立即购买</button>
      <button class="btn btn-primary" id="dAdd" onclick="addFromDetail()">加入购物车</button>
    </div>
  </div>
</div>

<!-- ============ 扫码 ============ -->
<div class="modal" id="dlgScan" style="width:440px">
  <div class="modal-head"><h3 style="font-size:16px">扫码找货</h3><button class="icon-btn" onclick="closeAll()">✕</button></div>
  <div class="modal-body">
    <div class="field">
      <label for="scanCode">商品条码（8–14 位）</label>
      <input class="input" id="scanCode" placeholder="扫码枪直接扫，或手动输入条码" onkeydown="if(event.key==='Enter')scanNow()">
    </div>
    <div class="muted" style="font-size:12px;margin-top:10px" id="scanTip"></div>
    <button class="btn btn-primary btn-block mt-lg" onclick="scanNow()">查这个条码</button>
  </div>
</div>

<!-- 第 27 轮（P1-4）：下单结果要能被读屏播报，toast 加 role=status + aria-live=polite -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="mall.js"></script>
<script src="pricing.js"></script>
<script src="sdy-api.js"></script>
<script>
/* ================= 顾客端 UI 层（数据与规则全走 Mall / SdyApi） ================= */
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const yuan = n => '¥' + (Math.round((Number(n) || 0) * 100) / 100).toFixed(2);

let curCat = '全部', curFilter = '', view = 'home', selCode = null, detailQty = 1, deliveryType = 'pickup';
let pickedAddrId = 0, editAddrId = 0;   // 地址簿（D18）：当前选中的地址 / 正在编辑的地址
let searchTimer = null;                 // 第 27 轮（P1-10）：搜索防抖计时器
let modeSettled = false;                // 第 27 轮（P0-1）：探测结果没回来前不下「离线」结论

let toastTimer = null;
// 第 27 轮（P0-1/P1-3）：下单反馈要分色——kind='ok' 绿色（真进店系统），kind='warn' 黄色（离线未入库）。
// 颜色本身就是结论，别让顾客读完一整句才发现这单根本没进店。
function toast(msg, ms, kind) {
  const t = $('toast');
  const cls = 'toast' + (kind ? ' ' + kind : '');
  t.textContent = msg; t.className = cls + ' show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = cls; }, ms || 2400);
}
function show(id) { const e = $(id); e.className = e.className.replace(' show', '') + ' show'; $('mask').className = 'mask show'; }
function closeAll() {
  ['cartSheet', 'dlgCheckout', 'dlgDetail', 'dlgScan', 'dlgAddr'].forEach(id => { const e = $(id); e.className = e.className.replace(' show', ''); });
  $('mask').className = 'mask';
}

/* ---------------- 连接模式 / 降级提示（第 27 轮 P0-1） ---------------- */
// SdyApi 探测失败会静默把 mode 置成 local（离线演示），页面以前照样弹绿色「下单成功」，
// 顾客就以为店里收到了。这里把降级显式化：常驻黄条 + 结算处再提醒 + 禁用提交按钮；
// 恢复在线（重试连接 / 浏览器 online 事件）后自动收起。判断只看 SdyApi，页面不自己写死。
const OFFLINE_TEXT = '⚠️ 当前是本地演示模式：下单不会进店里系统，店里收不到，请检查网络后刷新页面重试。';
const PENDING_TEXT = '⏳ 正在连接店里系统…连上之前不能提交订单。';
const OFFLINE_TEXT_CO = '⚠️ 本地演示模式：这一单不会进店里系统，所以「提交订单」已停用；请检查网络后刷新页面重试。';
function applyMode() {
  const online = modeSettled && SdyApi.on();   // 探测没回来一律按「不可下单」处理（fail-closed）
  // 先让提示区可见、再把文字写进去，读屏才会播报这次变化
  const bar = $('offlineBar');
  if (bar) bar.textContent = online ? '' : (modeSettled ? OFFLINE_TEXT : PENDING_TEXT);
  const wrap = $('offlineWrap');
  if (wrap) wrap.className = 'offline-wrap' + (online ? ' hide' : '');
  const co = $('coOffline');
  if (co) {
    co.className = 'offline-bar' + (online ? ' hide' : '');
    co.textContent = online ? '' : OFFLINE_TEXT_CO;
  }
  const btn = $('btnSubmit');
  if (btn) {
    const busy = btn.textContent === '提交中…';
    btn.disabled = !online;
    btn.className = 'btn btn-primary' + (online ? '' : ' dis');
    if (!busy) btn.textContent = '提交订单';
  }
}
function renderModeBadge(st) {
  const badge = $('modeBadge'); if (!badge) return;
  badge.textContent = '';
  // 顾客端不露技术报错（title 里以前是 Failed to fetch），只给一句人话
  badge.title = (st && st.online) ? '已连接店里系统' : '本地演示模式：未连接店里系统';
  badge.className = 'dot-mode ' + (st && st.online ? 'on' : 'off');
}
async function retryConnect() {
  const st = await SdyApi.boot();
  modeSettled = true;
  renderModeBadge(st);
  applyMode();
  if (st && st.online) refreshAll();
}
// 第 27 轮（P1-9）：卡片/chip 原来只有 onclick，键盘完全按不动。统一补 Enter/Space 等价于点按。
function keyAct(e, fn, arg) {
  if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); fn(arg); }
}

/* ---------------- 小工具 ---------------- */
function emojiOf(name) {
  const s = String(name || '');
  const map = [['可乐', '🥤'], ['汽水', '🥤'], ['水', '💧'], ['牛奶', '🥛'], ['奶', '🥛'], ['纸', '🧻'], ['饼', '🍪'], ['啤酒', '🍺'], ['酒', '🍺'], ['米', '🍚'], ['油', '🫒'], ['茶', '🍵'], ['面', '🍜']];
  for (const kv of map) if (s.includes(kv[0])) return kv[1];
  return '📦';
}

/* ---------------- 首页 ---------------- */
// 顾客端只看上架商品（D23）：下架商品不出现在分类、搜索结果与首页列表里
function products() { return Mall.listOnSale(); }
// 有效价（任务池⑦ / D24）：服务端按顾客等级算好 p.price；离线按本地等级兜底。
// 批发价低于零售价时，把零售价划掉显示，让批发客户一眼看到便宜了多少。
function priceHTML(p) {
  const whole = Mall.isWholesalePrice(p);
  return '<span class="price' + (whole ? ' whole' : '') + '">' + yuan(Mall.priceOf(p)) + '</span>' +
    (whole ? '<small class="oldp" title="零售价">' + yuan(p.salePrice) + '</small>' : '');
}
// 「我的价格」按钮：手机号就是身份（D24），带上手机号重新取价
function renderMyPrice() {
  const btn = $('btnMyPrice'); if (!btn) return;
  const ph = Mall.getMyPhone();
  const label = Pricing.tierLabel(Mall.getMyTier());
  btn.textContent = ph ? ('💰 ' + label + '价') : '💰 我的价格';
  btn.title = ph ? ('当前按手机号 ' + ph + '（' + label + '）显示价格；点一下可换手机号')
                 : '输入手机号，按你的顾客等级显示价格（批发 / 白名单客户会看到批发价）';
}
async function openMyPrice() {
  const cur = Mall.getMyPhone();
  const input = (typeof prompt === 'function')
    ? prompt('输入手机号，按你的顾客等级显示价格：\n批发 / 白名单客户会看到批发价；留空就按零售价。', cur)

// 商品图：有图用图，没图回退 emoji（本地演示目录没有 img 字段）
function picHTML(p, cls) {
  return p.img
    ? '<img class="' + cls + '" src="' + esc(p.img) + '" alt="' + esc(p.name) + '" loading="lazy" onerror="this.style.display=\'none\'">'
    : esc(p.emoji || emojiOf(p.name));
}
function renderCats() {
  const cats = ['全部'].concat([...new Set(products().map(p => p.category).filter(Boolean))]);
  $('cats').innerHTML = cats.map(c =>
    '<div class="chip' + (c === curCat ? ' on' : '') + '" role="button" tabindex="0" onclick="pickCat(\'' + esc(c) + '\')" onkeydown="keyAct(event,pickCat,\'' + esc(c) + '\')">' + esc(c) + '</div>').join('');
}
function pickCat(c) { curCat = c; renderCats(); renderGrid(); }
// 第 27 轮（P1-10）：每敲一个字就整块重建商品卡 DOM 太费，250ms 内只渲染最后一次输入
function doSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(renderGrid, 250);
}
function renderGrid() {
  const kw = (($('q') && $('q').value) || '').trim().toLowerCase();
  const list = products().filter(p => {
    if (curCat !== '全部' && p.category !== curCat) return false;

  });

function cardHTML(p) {
  const out = p.stock <= 0;
  return '<div class="pcard" role="button" tabindex="0" onclick="openDetail(\'' + p.code + '\')" onkeydown="keyAct(event,openDetail,\'' + p.code + '\')">' +
    '<div class="ph">' + picHTML(p, 'pimg') + (out ? '<div class="oos">已售罄</div>' : '') + '</div>' +
    '<div class="pb">' +
      '<div class="pname">' + esc(p.name) + '</div>' +
      '<div class="pmeta">' + esc(p.brand || '') + (p.brand ? ' · ' : '') + esc(p.spec || '') + '</div>' +
      '<div class="pfoot">' +
        '<div>' + priceHTML(p) + '<small> /' + esc(p.unit || '件') + '</small>' +
        '<div class="stk' + (out ? ' out' : '') + '">' + (out ? '暂时缺货' : '库存 ' + p.stock) + '</div></div>' +

/* ---------------- 商品详情 ---------------- */
function openDetail(code) {
  const p = Mall.getProduct(code);
  if (!p) return toast('商品库里没有这个条码：' + code);
  if (p.onSale === false) return toast('「' + p.name + '」已下架，可以到店里问问老板');
  selCode = code; detailQty = 1;
  $('dEmoji').innerHTML = picHTML(p, 'dimg');
  $('dName').textContent = p.name;
  $('dCode').textContent = p.code;
  $('dBrand').textContent = p.brand || '—';
  $('dSpec').textContent = p.spec || '—';
  $('dPrice').innerHTML = priceHTML(p) + '<small> /' + esc(p.unit || '件') + '</small>';
  $('dStock').textContent = p.stock <= 0 ? '已售罄，到店问老板' : '库存 ' + p.stock + ' ' + (p.unit || '件');
  $('dQty').textContent = detailQty;
  const dis = p.stock <= 0;
  $('dAdd').className = 'btn btn-primary' + (dis ? ' dis' : '');
  $('dBuy').className = 'btn' + (dis ? ' dis' : '');
  show('dlgDetail');
}
function stepQty(d) {
  const p = Mall.getProduct(selCode);
  if (!p) return;
  detailQty = Math.max(1, Math.min(detailQty + d, Math.max(p.stock, 1)));
  $('dQty').textContent = detailQty;
}
function addFromDetail() {
  try { Mall.addToCart(selCode, detailQty); toast('已加入购物车'); refreshAll(); closeAll(); }
  catch (e) { toast(e.message); }
}
function quickAdd(code) {
  try { Mall.addToCart(code, 1); toast('已加入购物车'); refreshAll(); }
  catch (e) { toast(e.message); }
}
// 立即购买：只结算详情页这一件，购物车原样不动（下单成功/失败都不会污染购物车）
function buyNowFromDetail() {
  const p = Mall.getProduct(selCode);
  if (!p) return toast('商品不存在');
  if (p.stock <= 0) return toast('「' + p.name + '」已售罄');
  Mall.setBuyNow([{ code: selCode, qty: Math.min(detailQty, p.stock) }]);
  closeAll();
  goCheckout();
}

/* ---------------- 购物车 ---------------- */
function openCart() { renderCart(); show('cartSheet'); }
function renderCart() {
  const s = Mall.cartSummary();
  $('cartHeadCount').textContent = s.count ? '（' + s.count + ' 件）' : '';
  $('cartLines').innerHTML = s.lines.length ? s.lines.map(l =>
    '<div class="citem">' +
      '<div class="cph">' + picHTML(l, 'cimg') + '</div>' +
      '<div><div class="cn">' + esc(l.name) + '</div><div class="cs">' + yuan(l.price) + ' / ' + esc(l.unit || '件') +
        (l.wholesale ? ' · <span class="wtag">批发价</span>' : '') +
        (l.onSale === false ? ' · <span style="color:#b91c1c">已下架</span>' : '') +
        (l.qty >= l.stock ? ' · <span style="color:#b91c1c">已达库存上限</span>' : '') + '</div></div>' +
      '<div class="row">' +
        '<div class="stepper"><button onclick="stepCart(\'' + l.code + '\',-1)">−</button>' +
        '<span class="v">' + l.qty + '</span>' +
        '<button onclick="stepCart(\'' + l.code + '\',1)">＋</button></div>' +
        '<button class="btn btn-ghost btn-xs" onclick="dropCart(\'' + l.code + '\')">删除</button>' +
      '</div>' +

  $('cartFee').textContent = s.count ? (deliveryType === 'pickup' ? '自提免配送费' : yuan(fee)) : '—';
  $('cartTotal').textContent = yuan(s.subtotal + fee);
}
function stepCart(code, d) {
  const it = Mall.getCart().find(i => i.code === code);
  if (!it) return;
  try { Mall.setQty(code, it.qty + d); renderCart(); renderCartBadge(); }
  catch (e) { toast(e.message); }
}
function dropCart(code) { Mall.removeItem(code); renderCart(); renderCartBadge(); renderGrid(); }
function clearCartNow() { Mall.clearCart(); renderCart(); renderCartBadge(); renderGrid(); toast('购物车已清空'); }
function renderCartBadge() {
  const s = Mall.cartSummary();
  $('cartDot').innerHTML = String(s.count);
  const bar = $('cartBar');
  if (s.count > 0) {
    bar.className = 'cartbar';
    $('barCount').textContent = String(s.count);
    $('barText').textContent = '合计 ' + yuan(s.subtotal) +
      (s.subtotal >= Mall.DELIVERY_RULES.minFree ? ' · 已满 ' + Mall.DELIVERY_RULES.minFree + ' 元免配送' : '');
  } else {
    bar.className = 'cartbar hide';
  }
}

/* ---------------- 收货地址簿（D18） ---------------- */
function curPhone() { return (($('cPhone') && $('cPhone').value) || '').trim(); }
function bookPhone() {
  const v = (($('afPhone') && $('afPhone').value) || '').trim();
  return v || curPhone();
}
function addrListOf(phone) { try { return Mall.listAddresses(phone); } catch (e) { return []; } }
async function refreshAddresses(phone) {
  if (!phone) return [];
  try { return await SdyApi.listAddresses(phone); }
  catch (e) { return addrListOf(phone); }
}
function renderAddrPick() {
  const wrap = $('addrPickWrap');
  if (deliveryType !== 'delivery') { wrap.className = 'field mt-lg hide'; return; }
  wrap.className = 'field mt-lg';
  const list = addrListOf(curPhone());
  $('addrPick').innerHTML = list.length ? list.map(a =>
    '<div class="addr-item' + (a.id === pickedAddrId ? ' on' : '') + '" role="button" tabindex="0" onclick="pickAddr(' + a.id + ')" onkeydown="keyAct(event,pickAddr,' + a.id + ')">' +
      '<div class="who"><b>' + esc(a.contact) + '</b><span class="mono">' + esc(a.phone) + '</span>' +
      (a.isDefault ? '<span class="badge st-done">默认</span>' : '') + '</div>' +
      '<div class="ad">' + esc(a.address) + '</div>' +
    '</div>').join('')
    : '<div class="muted" style="font-size:12.5px">还没有存过地址；填一次并勾选「保存到地址簿」就会记住。</div>';
}
function pickAddr(id) {
  const a = addrListOf(curPhone()).find(x => x.id === id);
  if (!a) return;
  pickedAddrId = id;
  $('cName').value = a.contact || '';
  $('cPhone').value = a.phone || '';
  $('cAddr').value = a.address || '';

}
async function onPhoneChange() {
  pickedAddrId = 0;
  const ph = curPhone();
  // 手机号就是身份（D24）：填了手机号就按他的顾客等级重新取价。
  // 取价失败不挡下单——服务端下单时仍会按真实等级算价（价格口径真源在服务端）。
  if (ph && ph !== Mall.getMyPhone()) {
    try {
      const r = await SdyApi.setMyPhone(ph);
      refreshAll(); renderCheckout(); renderMyPrice();
      toast('已按手机号 ' + ph + ' 的「' + Pricing.tierLabel(r && r.tier) + '价」显示', 3200);
    } catch (e) { /* 忽略：下单时服务端仍按真实等级算价 */ }
  }
  await refreshAddresses(ph);
  renderAddrPick();
}
async function openAddrBook() {
  const phone = curPhone() || (((Mall._load('mall_customer', null) || {}).phone) || '');
  resetAddrForm();
  if (phone) $('afPhone').value = phone;
  await refreshAddresses(phone);
  renderAddrBook();
  closeAll(); show('dlgAddr');
}
function renderAddrBook() {
  const phone = bookPhone();
  const list = phone ? addrListOf(phone) : [];
  $('addrBookList').innerHTML = list.length ? list.map(a =>
    '<div class="addr-item">' +
      '<div class="who"><b>' + esc(a.contact) + '</b><span class="mono">' + esc(a.phone) + '</span>' +
      (a.isDefault ? '<span class="badge st-done">默认</span>' : '') + '</div>' +
      '<div class="ad">' + esc(a.address) + '</div>' +
      '<div class="ops">' +
        '<button class="btn btn-xs" onclick="editAddr(' + a.id + ')">编辑</button>' +
        (a.isDefault ? '' : '<button class="btn btn-xs" onclick="setDefaultAddr(' + a.id + ')">设为默认</button>') +
        '<button class="btn btn-xs" onclick="delAddr(' + a.id + ')">删除</button>' +
      '</div>' +
    '</div>').join('')
    : '<div class="muted" style="font-size:12.5px">' + (phone ? '这个手机号还没存过地址，先在下面填一条。' : '先填手机号，再保存地址。') + '</div>';
}
function editAddr(id) {
  const a = addrListOf(bookPhone()).find(x => x.id === id);
  if (!a) return;
  editAddrId = a.id;
  $('afTitle').textContent = '编辑地址';
  $('afContact').value = a.contact || '';
  $('afPhone').value = a.phone || '';
  $('afAddr').value = a.address || '';
  $('afDefault').checked = !!a.isDefault;
}
function resetAddrForm() {
  editAddrId = 0;
  $('afTitle').textContent = '新增地址';
  $('afContact').value = '';
  $('afPhone').value = curPhone() || (((Mall._load('mall_customer', null) || {}).phone) || '');
  $('afAddr').value = '';
  $('afDefault').checked = false;
}
async function saveAddrForm() {
  const payload = {
    id: editAddrId,
    phone: (($('afPhone').value) || '').trim(),
    contact: (($('afContact').value) || '').trim(),
    address: (($('afAddr').value) || '').trim(),
    isDefault: !!$('afDefault').checked
  };
  try {
    const saved = await SdyApi.saveAddress(payload);
    if (saved && saved.id) pickedAddrId = saved.id;
    toast('地址已保存');
    renderAddrBook(); renderAddrPick();
  } catch (e) { toast(e.message, 3600); }
}
async function setDefaultAddr(id) {
  const a = addrListOf(bookPhone()).find(x => x.id === id);
  if (!a) return;
  try {
    await SdyApi.saveAddress({ id: a.id, phone: a.phone, contact: a.contact, address: a.address, isDefault: true });
    toast('已设为默认地址');
    renderAddrBook(); renderAddrPick();
  } catch (e) { toast(e.message, 3600); }
}
async function delAddr(id) {
  if (typeof confirm === 'function' && !confirm('删除这条地址？')) return;
  try {
    await SdyApi.deleteAddress(bookPhone(), id);
    if (pickedAddrId === id) pickedAddrId = 0;
    toast('地址已删除');
    renderAddrBook(); renderAddrPick();
  } catch (e) { toast(e.message, 3600); }
}

/* ---------------- 结算 ---------------- */
async function goCheckout() {
  if (!Mall.cartSummary().count) return toast('购物车是空的');
  const last = Mall._load('mall_customer', null);
  if (last) { $('cName').value = last.name || ''; $('cPhone').value = last.phone || ''; $('cAddr').value = last.address || ''; }
  pickedAddrId = 0;
  const phone = curPhone();
  if (phone) {
    const list = await refreshAddresses(phone);
    const def = list.find(a => a.isDefault) || list[0];
    if (def) {   // 有地址簿就一键带出默认地址
      $('cName').value = def.contact || $('cName').value;
      $('cPhone').value = def.phone || $('cPhone').value;
      $('cAddr').value = def.address || '';
      pickedAddrId = def.id;
    }
  }
  renderAddrPick();
  renderCheckout();
  closeAll(); show('dlgCheckout');
  applyMode();   // 第 27 轮（P0-1）：弹窗盖住了顶部提示条，这里同步弹窗内提示与提交按钮禁用态
}
function pickDelivery(t) {
  deliveryType = t;
  $('optPickup').className = 'dopt' + (t === 'pickup' ? ' on' : '');
  $('optDelivery').className = 'dopt' + (t === 'delivery' ? ' on' : '');
  $('addrField').className = 'field mt' + (t === 'delivery' ? '' : ' hide');
  renderAddrPick();
  renderCheckout(); renderCart();
}
function renderCheckout() {
  const s = Mall.cartSummary();
  const fee = Mall.calcDeliveryFee(deliveryType, s.subtotal);
  const R = Mall.DELIVERY_RULES;
  $('coCount').textContent = String(s.count);
  $('coSubtotal').textContent = yuan(s.subtotal);
  $('coFee').textContent = deliveryType === 'pickup' ? '免' : yuan(fee);
  $('coTotal').textContent = yuan(s.subtotal + fee);
  $('feeHint').textContent = (Mall.peekBuyNow() ? '立即购买：只结算这一件，购物车里的东西不受影响。' : '') + (deliveryType === 'pickup'
    ? '到店自提不收配送费，到店报手机号取货。'
    : (s.subtotal >= R.minFree ? '已满 ' + R.minFree + ' 元，免配送费 🎉' : '再买 ' + yuan(R.minFree - s.subtotal) + ' 就免 ' + R.fee + ' 元配送费'));
}
async function submitOrder() {
  const name = ($('cName').value || '').trim();
  const phone = ($('cPhone').value || '').trim();
  const address = ($('cAddr').value || '').trim();
  if (!name) return toast('请填写收货人');
  if (!/^1\d{10}$/.test(phone)) return toast('手机号看起来不对（要 11 位数字）');
  if (deliveryType === 'delivery' && !address) return toast('送货上门需要填地址');
  const btn = $('btnSubmit');
  btn.textContent = '提交中…'; btn.className = 'btn btn-primary dis';
  const online = SdyApi.on();   // 第 27 轮（P0-1）：先记下这单是要进店里系统，还是只留在本地演示
  try {
    const order = await SdyApi.createOrder({ deliveryType: deliveryType, customer: { name: name, phone: phone, address: address } });
    Mall._save('mall_customer', { name: name, phone: phone, address: address });
    if (deliveryType === 'delivery' && $('addrSave') && $('addrSave').checked) {
      // 顺手存进地址簿（D18）：与带出的那条一模一样就不重复写；改了内容则存成新的一条，
      // 绝不覆盖已有地址（要改已有地址走「地址簿管理」的编辑）。失败不影响下单结果。
      const picked = pickedAddrId ? addrListOf(phone).filter(a => a.id === pickedAddrId)[0] : null;
      const same = picked && picked.contact === name && picked.address === address;
      if (!same) {
        try { await SdyApi.saveAddress({ id: 0, phone: phone, contact: name, address: address, isDefault: false }); }
        catch (e) { console.warn('地址簿保存失败：' + e.message); }
      }
    }
    // 第 27 轮（P0-1/P1-3）：在线=绿色「已下单」；离线=黄色警示且必须写明「未入库」，
    // 绝不能再让顾客把离线演示当成下单成功。
    if (online) {
      toast('✅ 已下单 ' + order.id + '：店家已收到，可以在「我的订单」里看进度', 3200, 'ok');
    } else {
      toast('⚠️ 未入库：这一单只存在本机演示里，店里收不到，请连上网络后重新下单（单号 ' + order.id + '）', 5200, 'warn');
    }
    closeAll(); refreshAll();
    // 第 27 轮（P1-13）：在线成功才进「我的订单」；离线不跳转，免得像走完了正常下单流程
    if (online) switchView('orders');
  } catch (e) {
    toast(e.message, 3600);   // 后端原文照播（如「库存不足」），购物车不清空
  } finally {
    btn.textContent = '提交订单';
    applyMode();   // 第 27 轮（P0-1）：恢复按钮的在线/离线态（离线仍保持禁用）
  }
}

/* ---------------- 我的订单 ---------------- */
// 第 27 轮（P1-12）：状态名真源只有 mall.js 的 STATUS_META（ready=待取货、pending=待备货），
// 页面不再自己写一份——以前这里自己写的名字和小程序/后端对不上。
const FILTERS = [['全部', '']].concat(['pending', 'delivering', 'ready', 'done', 'cancelled'].map(s => [Mall.STATUS_META[s].label, s]));
function renderFilters() {

function renderOrders() {

}
async function refreshOrders() {
  if (SdyApi.on()) { try { await SdyApi.sync(); } catch (e) { toast(e.message); } }
  renderOrders();
}
function reorder(id) {
  const o = Mall.getOrders().find(x => x.id === id);
  if (!o) return;
  let n = 0;
  o.items.forEach(i => { try { Mall.addToCart(i.code, i.qty); n++; } catch (e) {} });
  refreshAll();
  toast(n ? '已把 ' + n + ' 种商品加回购物车' : '加不回去了，商品可能已下架');
  switchView('home');
}
async function cancelMine(id) {
  if (typeof confirm === 'function' && !confirm('确定取消这一单？库存会自动回补。')) return;
  try { await SdyApi.cancelOrder(id); toast('订单已取消'); }
  catch (e) { toast(e.message, 3600); }
  // 第 27 轮（P1-11）：取消会回补库存，首页商品列表/购物车也得跟着刷新，否则还显示旧库存
  refreshAll();
}
// 送货到家 / 到店自提 → 已完成（与小程序同一状态机，服务端拦非法迁移）
async function advanceMine(id) {
  try { await SdyApi.advanceOrder(id, 'done'); toast('已确认收货，谢谢惠顾'); }
  catch (e) { toast(e.message, 3600); }
  renderOrders();
}

/* ---------------- 视图 ---------------- */
function switchView(v) {
  view = v;
  $('viewHome').className = v === 'home' ? '' : 'hide';
  $('viewOrders').className = v === 'orders' ? '' : 'hide';
  $('tabHome').className = 'tn' + (v === 'home' ? ' on' : '');
  $('tabOrders').className = 'tn' + (v === 'orders' ? ' on' : '');
  if (v === 'orders') renderOrders();
}

/* ---------------- 扫码 ---------------- */
function openScan() {
  $('scanCode').value = '';
  $('scanTip').textContent = '扫码枪可直接扫；手动输入示例：6901234567892。店里没有的商品会提示未建档。';
  show('dlgScan');
  setTimeout(() => { try { $('scanCode').focus(); } catch (e) {} }, 50);
}
async function scanNow() {
  const code = ($('scanCode').value || '').trim();
  if (!/^\d{8,14}$/.test(code)) return toast('条码应该是 8–14 位数字');
  const p = Mall.getProduct(code);
  if (p) { closeAll(); openDetail(code); return toast('找到了：' + p.name); }
  if (!SdyApi.on()) return toast('本地没有这个条码，且后端未连接');
  try {
    const r = await SdyApi.resolveBarcode(code);
    toast(r && (r.found || r.name) ? '查到：' + (r.name || code) + '（还没上架，联系老板建档）' : '这个条码没查到商品', 3600);
  } catch (e) { toast(e.message, 3600); }
}

/* ---------------- 刷新 / 启动 ---------------- */
function refreshAll() {
  renderCats(); renderGrid(); renderCartBadge(); renderFilters(); renderOrders(); renderMyPrice();
  const cs = $('cartSheet');
  if (cs.className.indexOf('show') >= 0) renderCart();
}
Mall.loadCatalog();
refreshAll();
renderCart();
applyMode();   // 第 27 轮（P0-1））探测还没回来：先禁用提交并显示「正在连接…」

(async function initApi() {
  // 连接状态只用一个点表示（第 25 轮 / D31）：绿=后端在线，灰=本地演示。
  // 文字说明留在 title 里，页面上不出现「后端已连接」这种开发信息。
  const st = await SdyApi.boot();
  modeSettled = true;   // 第 27 轮（P0-1）：探测有结果了，离线态才作数
  renderModeBadge(st);
  applyMode();
  if (st.online) refreshAll();
})();
// 第 27 轮（P0-1）：浏览器报「网络恢复」时自动重连一次，黄条随之消失（假 DOM 没有这个 API，跳过）
if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
  window.addEventListener('online', retryConnect);
}
</script>
